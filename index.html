<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clan Hub</title>
  <!-- Офіційний скрипт Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #18191c);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
      color: var(--tg-theme-accent-text-color, #ffaa00);
    }

    .subtitle {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888888);
      margin-bottom: 20px;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #232428);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      background: #ffaa00;
      color: #000;
      margin-left: 6px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="user-name">Привіт, Боєць! 👋</h1>
  <div class="subtitle">Панель керування кланом</div>

  <div class="card">
    <div style="font-size: 16px; font-weight: bold;">
      ⚔ Стан клану <span class="badge">Війни</span>
    </div>
    <p style="font-size: 13px; color: #bbb; margin: 8px 0 0 0;">
      Тут відображатиметься інформація про КВ, героїв та активність бійців.
    </p>
  </div>

  <button class="btn" onclick="sendDataToBot()">Закрити вікно</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Розгортає на весь екран

    // Отримуємо ім'я юзера з Telegram
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('user-name').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}! 👋`;
    }

    function sendDataToBot() {
      tg.close();
    }
  </script>
</body>
</html>
